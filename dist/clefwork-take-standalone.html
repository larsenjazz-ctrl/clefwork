<style>
:root {
  --bg: #e9edf4;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --ink: #141b2e;
  --ink-2: #39425a;
  --muted: #5f6880;
  --line: #d4dae6;
  --line-2: #bcc5d6;
  --accent: #2f3fbf;
  --accent-hover: #24329e;
  --accent-soft: #e1e5fb;
  --on-accent: #ffffff;
  --good: #137a4b;
  --good-soft: #dcf2e6;
  --bad: #bf3139;
  --bad-soft: #fbe2e4;
  --warn: #8a5d0c;
  --warn-soft: #f8edd5;
  --paper: #fdfdfe;
  --staff-ink: #172036;
  --shadow: 0 1px 2px rgba(20, 27, 46, 0.05), 0 10px 30px -18px rgba(20, 27, 46, 0.35);
  --r: 12px;
  --f-display: 'Bricolage Grotesque', 'Noto Music', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Noto Music', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', 'Noto Music', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121b; --surface: #161b27; --surface-2: #1c2230; --ink: #e8ecf5; --ink-2: #c3cad9; --muted: #98a1b5;
    --line: #2a3243; --line-2: #394257; --accent: #93a0ff; --accent-hover: #aab4ff; --accent-soft: #252c55; --on-accent: #0e121b;
    --good: #52c68f; --good-soft: #15352a; --bad: #f2757c; --bad-soft: #3d1c21; --warn: #e6b65c; --warn-soft: #3a2e14;
    --paper: #f3f4f8; --staff-ink: #172036; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -16px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121b; --surface: #161b27; --surface-2: #1c2230; --ink: #e8ecf5; --ink-2: #c3cad9; --muted: #98a1b5;
  --line: #2a3243; --line-2: #394257; --accent: #93a0ff; --accent-hover: #aab4ff; --accent-soft: #252c55; --on-accent: #0e121b;
  --good: #52c68f; --good-soft: #15352a; --bad: #f2757c; --bad-soft: #3d1c21; --warn: #e6b65c; --warn-soft: #3a2e14;
  --paper: #f3f4f8; --staff-ink: #172036; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -16px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.acc { font-family: 'Noto Music', 'Apple Symbols', 'Segoe UI Symbol', serif; font-weight: 400; font-size: 1.3em; line-height: 0; position: relative; top: -0.22em; margin: 0 0.02em; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--ink); font: 16px/1.5 var(--f-body);
  padding-inline: 16px; padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { max-width: 1180px; margin: 0 auto; }

/* ---------- masthead ---------- */
.mast {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding-block: 18px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 40px; height: 46px; flex: none; background: var(--logo-mark) center / contain no-repeat; }
.brand-name { font: 800 26px/1 var(--f-display); letter-spacing: -0.02em; }
.nav { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; flex-wrap: wrap; }
.nav button {
  border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  font-weight: 700; color: var(--muted); white-space: nowrap;
}
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.flow {
  display: flex; gap: 6px 22px; flex-wrap: wrap; margin: 0 0 22px; padding: 0; list-style: none;
  font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px;
}
.flow li { display: flex; align-items: baseline; gap: 8px; }
.flow b { font: 700 12px/1 var(--f-mono); color: var(--accent); }

/* ---------- common ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.eyebrow { font: 700 11.5px/1.2 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.display { font: 800 clamp(28px, 4.2vw, 40px)/1.08 var(--f-display); letter-spacing: -0.025em; margin: 6px 0 8px; text-wrap: balance; }
.lede { color: var(--ink-2); margin: 0 0 18px; max-width: 60ch; }
.fine { font-size: 13.5px; color: var(--muted); margin: 12px 0 0; max-width: 62ch; }
.card-title { font: 700 19px/1.2 var(--f-display); margin: 2px 0 12px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.narrow { max-width: 640px; margin: 0 auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none;
  transition: background 0.12s, border-color 0.12s, transform 0.08s;
}
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-quiet:hover { background: var(--surface-2); border-color: var(--line); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.btn-link, .linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.btn-link { margin-top: 12px; font-size: 14px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn-row.center { justify-content: center; }

.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mini-label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.help { font-size: 13px; color: var(--muted); }
input[type="text"], input[type="number"], textarea {
  width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 10px 12px; min-height: 42px;
}
textarea { resize: vertical; font-family: var(--f-mono); font-size: 14px; line-height: 1.6; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; align-self: flex-start; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--muted); min-width: 36px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 27, 46, 0.15), inset 0 0 0 1px var(--line-2); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 13px; cursor: pointer;
  font-weight: 700; font-size: 14px; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"]::before { content: '✓ '; }

.toggle { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 6px 0; }
.toggle .track { flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; transition: background 0.15s; margin-top: 1px; }
.toggle .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
.toggle input:checked + .track { background: var(--accent); }
.toggle input:checked + .track::after { transform: translateX(16px); }
.toggle input:focus-visible + .track { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.toggle-text { display: flex; flex-direction: column; gap: 1px; }
.toggle-text strong { font-size: 15px; }
.toggle-text small { font-size: 13px; color: var(--muted); }

.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); flex: none; }
.stepper button { width: 36px; border: 0; background: var(--surface-2); cursor: pointer; font-size: 18px; font-weight: 700; color: var(--ink-2); }
.stepper button:hover { background: var(--accent-soft); color: var(--accent); }
.stepper input { width: 50px; min-height: 38px; border: 0; border-radius: 0; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.code {
  display: block; font: 500 15px/1.7 var(--f-mono); letter-spacing: 0.04em; word-break: break-all;
  background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px 14px;
  user-select: all; -webkit-user-select: all; color: var(--ink);
}
.code-lg { font-size: 17px; padding: 16px 18px; }

.ex-dialog {
  width: min(560px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: var(--r); padding: 20px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
.ex-dialog::backdrop { background: rgba(14, 18, 27, 0.45); }
.ex-dialog > * + * { margin-top: 14px; }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ex-head h2 { margin: 0; font: 700 20px/1.2 var(--f-display); }
.ex-ask { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.ex-ask .btn-row { margin-top: 10px; }
.ex-status { font-size: 14px; padding: 10px 12px; border-radius: 8px; }
.ex-status:empty { display: none; }
.ex-status.is-good { background: var(--good-soft); color: var(--good); }
.ex-status.is-warn { background: var(--warn-soft); color: var(--warn); }
.ex-status.is-bad { background: var(--bad-soft); color: var(--bad); }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 10px; font-weight: 700; font-size: 14.5px;
  opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; max-width: calc(100vw - 32px); z-index: 50; text-align: center;
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.toast.is-bad { background: var(--bad); color: #fff; }

/* ---------- builder ---------- */
.build { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 24px; align-items: start; }
.build-form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sec { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.sec-head h2 { font: 700 20px/1.2 var(--f-display); letter-spacing: -0.01em; margin: 0; }
.sec-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.sec.is-off > :not(.sec-head):not(.off-note) { opacity: 0.4; pointer-events: none; }
.off-note { display: none; margin: 0; font-size: 13.5px; color: var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 8px; align-self: flex-start; }
.sec.is-off .off-note { display: block; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.presets { display: flex; flex-direction: column; gap: 8px; }
.preset-row { display: flex; flex-wrap: wrap; gap: 6px; }
.preset-row .btn { border-color: var(--line); background: var(--surface-2); }
.staff .brace { fill: var(--staff-ink); }
.mix-foot { display: flex; justify-content: flex-end; }
.mix-total { font: 700 14px/1 var(--f-mono); color: var(--accent); }
.qt-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qt {
  display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface-2); position: relative; transition: border-color 0.12s, background 0.12s;
}
.qt.is-on { background: var(--surface); border-color: var(--line-2); }
.qt.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--surface); }
.qt-tab { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-height: 38px; }
.qt-tab::after { content: ''; position: absolute; inset: 0; border-radius: 10px; }
.qt-tab:focus-visible { outline: none; }
.qt:has(.qt-tab:focus-visible) { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.qt-name { font: 700 15px/1.2 var(--f-display); color: var(--muted); }
.qt.is-on .qt-name, .qt.is-active .qt-name { color: var(--ink); }
.qt.is-active .qt-name { color: var(--accent); }
.qt-status { font-size: 12px; color: var(--muted); min-height: 1em; }
.qt .stepper { position: relative; z-index: 1; align-self: flex-start; }
.qt .stepper button { width: 30px; font-size: 16px; }
.qt .stepper button:disabled { opacity: 0.35; cursor: default; background: var(--surface-2); color: var(--muted); }
.qt .stepper input { width: 38px; min-height: 32px; }
.qt-panels { border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; }
.qt-panel { display: flex; flex-direction: column; gap: 16px; }
.qt-panel-head h3 { margin: 0; font: 700 18px/1.2 var(--f-display); }
.qt-panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.qt-panel.is-off .off-note { display: block; }
.qt-body { display: flex; flex-direction: column; gap: 14px; }
.warn-note { margin: 0; font-size: 13.5px; color: var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 8px; }
@media (max-width: 640px) { .qt-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .qt-panels { padding: 14px; } }
.seg.seg-col { flex-direction: column; align-items: stretch; }
.seg.seg-col button { text-align: left; padding: 8px 12px; }
select {
  width: 100%; min-height: 42px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: 9px; padding: 8px 10px; font: inherit;
}
select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pg-row .pg-title { font: 700 16px/1.3 var(--f-display); }
.pg-preview-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pg-msg { margin: 0; font-size: 13.5px; color: var(--bad); }
.pg-msg:empty { display: none; }
.staff .clabel { font: 700 13px var(--f-body); fill: var(--staff-ink); }
.staff .sacc { font-family: 'Noto Music', serif; font-weight: 400; font-size: 17px; }
.pg-answers { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; }
.pg-cell { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pg-num { font-size: 11.5px; font-weight: 700; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: 0.05em; }
input.pg-in { text-align: center; font: 700 16px var(--f-mono); padding: 6px 4px; min-height: 42px; }
input.pg-in:disabled { color: var(--ink); opacity: 1; }
input.pg-in.is-right { border-color: var(--good); background: var(--good-soft); }
input.pg-in.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.pg-fix { font: 700 12.5px var(--f-mono); color: var(--good); text-align: center; }
@media (max-width: 640px) { .pg-answers { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); } }
.dd-answers { display: flex; flex-wrap: wrap; gap: 12px; }
.dd-cell { display: flex; flex-direction: column; gap: 5px; min-width: 190px; flex: 1; }
.dd-cell select.is-right { border-color: var(--good); background: var(--good-soft); }
.dd-cell select.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.qt-panel .fld.is-off { opacity: 0.45; pointer-events: none; }
.staff .clabel.is-small { font-size: 10.5px; fill: var(--muted); }
.fig-rn { font: 700 20px/1 var(--f-display); white-space: nowrap; }
.fig-rn.is-big { font-size: clamp(30px, 5vw, 44px); }
.fig-one { font-size: 0.6em; vertical-align: -0.35em; margin-left: 1px; font-weight: 700; }
.fig-stack { display: inline-flex; flex-direction: column; vertical-align: -0.12em; margin-left: 2px; font-size: 0.52em; line-height: 1.02; font-weight: 700; }
.fig-given { display: flex; justify-content: center; padding: 6px 0 2px; }
.fig-answers { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.fig-cell { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fig-row { display: flex; gap: 6px; }
input.fig-in { width: 5.5em; flex: none; text-align: center; font: 700 16px var(--f-mono); }
select.fig-sel { min-width: 0; }
.fig-in.is-invalid, select.fig-sel.is-invalid { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.fig-unread.is-bad { color: var(--bad); }
.fig-preview { min-height: 22px; display: flex; align-items: center; gap: 6px; color: var(--accent); }
.fig-unread { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.fig-mark { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.fig-mark.is-right { color: var(--good); }
.fig-mark.is-wrong { color: var(--bad); }
@media (max-width: 720px) { .fig-answers { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.qcard.is-compact .fig-answers { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.qcard.is-compact .fig-row { flex-wrap: wrap; }
.ans-wrap { margin-top: 16px; }
.ans-list { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.ans-list:empty { display: none; }
.ans-jump {
  position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 3; display: flex; flex-wrap: wrap; gap: 5px;
  padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
}
.ans-jump .qdot { display: grid; place-items: center; text-decoration: none; }
.qdot.is-part { background: var(--warn); border-color: var(--warn); color: #fff; }
.qdot.is-blank { background: var(--surface-2); color: var(--muted); }
.ans-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; scroll-margin-top: 80px; }
.ans-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.ans-head strong { font: 700 16px/1.2 var(--f-display); }
.ans-time { margin-left: auto; font: 500 13px var(--f-mono); color: var(--muted); }
.rule-box { font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.rule-box ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.cc-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cc-empty { margin: 0; padding: 12px 14px; color: var(--muted); font-size: 14px; }
.cc-row { display: grid; grid-template-columns: minmax(5.5em, auto) 1fr auto; gap: 4px 14px; align-items: center; padding: 8px 8px 8px 14px; border-top: 1px solid var(--line); }
.cc-row:first-child { border-top: 0; }
.cc-row.is-editing { background: var(--accent-soft); }
.cc-sym { font: 700 19px/1.2 var(--f-display); }
.cc-meta { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); min-width: 0; }
.cc-notes { font-family: var(--f-mono); color: var(--ink-2); }
.cc-actions { display: flex; gap: 2px; }
.cc-editor { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.cc-edit-head strong { font: 700 16px/1.2 var(--f-display); }
.cc-shown { margin: 0; font-size: 14px; color: var(--muted); }
.cc-shown b { font: 700 18px/1 var(--f-display); color: var(--ink); margin-left: 4px; }
.cc-editor .btn-row { margin-top: 4px; }
@media (max-width: 640px) { .cc-row { grid-template-columns: 1fr auto; } .cc-meta { grid-column: 1 / -1; grid-row: 2; } }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }

.build-side { display: flex; flex-direction: column; gap: 16px; align-self: stretch; }
.build-side .preview { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); }
.share-summary { margin: 8px 0 12px; color: var(--ink-2); font-size: 14.5px; }
.share .btn-row { margin-top: 12px; }
.pv-count { font: 700 15px/1.3 var(--f-display); display: block; margin-top: 2px; }
.pager { display: flex; gap: 4px; }
.pv-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.key summary { cursor: pointer; font: 700 16px/1.2 var(--f-display); list-style-position: outside; }
.key-list { margin: 14px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; max-height: 360px; overflow: auto; }
.key-list li { padding-left: 4px; }
.key-q { display: block; color: var(--ink-2); }
.key-clef { color: var(--muted); }
.key-a { font: 500 13.5px/1.4 var(--f-mono); color: var(--accent); }

/* ---------- question + staff ---------- */
.qcard { display: flex; flex-direction: column; gap: 10px; }
.q-eyebrow { display: flex; gap: 10px; align-items: center; font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.q-clef { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); letter-spacing: 0.02em; text-transform: none; }
.q-text { font: 700 clamp(21px, 2.6vw, 27px)/1.2 var(--f-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.qcard.is-compact .q-text { font-size: 18px; }
.q-hint { margin: -4px 0 0; color: var(--muted); font-size: 14px; }
.staff-box {
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px;
  display: flex; justify-content: center; overflow: hidden;
}
.staff-box { position: relative; }
.play-btn {
  position: absolute; top: 8px; right: 8px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; padding: 0;
  border: 1px solid var(--line-2); background: #ffffff; color: #2f3fbf; box-shadow: 0 1px 3px rgba(20, 27, 46, 0.12);
}
.play-btn svg { width: 20px; height: 20px; }
.play-btn:hover { border-color: #2f3fbf; }
.play-btn.play-inline { position: static; width: 36px; height: 36px; flex: none; }
.pg-hear { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.play-btn.is-playing { background: #2f3fbf; color: #ffffff; border-color: #2f3fbf; }
.staff { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; color: var(--staff-ink); user-select: none; -webkit-user-select: none; }
.staff.is-readonly { cursor: default; touch-action: auto; }
.staff:focus { outline: none; }
.staff-box:has(.staff:focus-visible) { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.staff .sl { stroke: var(--staff-ink); stroke-width: 1.1; }
.staff .clef-glyph { font-family: 'Noto Music', 'Bravura Text', 'Apple Symbols', 'Segoe UI Symbol', serif; fill: var(--staff-ink); }
.staff .clef, .staff .ks { color: var(--staff-ink); }
.staff .slot { fill: #2f3fbf; opacity: 0.045; transition: opacity 0.12s; }
.staff .slot.is-hover { opacity: 0.11; }
.staff .note { color: var(--staff-ink); }
.staff .note .head { fill: currentColor; }
.staff .ledger { stroke: currentColor; stroke-width: 1.3; }
.staff .note.placed { color: #2f3fbf; cursor: grab; }
.staff .note.hover { opacity: 0.38; color: #2f3fbf; pointer-events: none; }
.staff .note.is-leaving { opacity: 0.25; }
.staff .note.is-right { color: #137a4b; }
.staff .note.is-wrong { color: #bf3139; }
.staff .note.expected { color: #137a4b; opacity: 0.5; }
.staff .halo { fill: #2f3fbf; opacity: 0.14; }
.staff .hit { fill: transparent; }
.staff .nlabel { font: 700 12px var(--f-body); fill: #2f3fbf; }

.palette-wrap { display: flex; flex-direction: column; gap: 8px; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tool {
  display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.tool:hover { border-color: var(--accent); color: var(--accent); }
.tool-drag { cursor: grab; }
.tool-sq { width: 44px; padding: 0; justify-content: center; }
.tool-sq svg { width: 18px; height: 18px; }
.tool .glyph { width: 22px; height: 18px; }
.tool .glyph-acc { width: 14px; height: 28px; }
.glyph .head { fill: currentColor; }
.tool-sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; }
.palette-hint { margin: 0; font-size: 13px; color: var(--muted); }
.ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 60; }
.ghost-in { transform: translate(-50%, -50%); background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 6px 8px; box-shadow: var(--shadow); display: flex; }
.ghost .glyph { width: 26px; height: 22px; }
.ghost .glyph-acc { width: 16px; height: 32px; }

.choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.choice {
  display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--line-2); background: var(--surface); font: 700 19px/1.1 var(--f-display); text-align: left;
}
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice-key { font: 700 12px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 5px; }
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.choice[aria-checked="true"] .choice-key { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.choice[disabled] { cursor: default; }
.choice.is-right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.qcard.is-compact .choices { grid-template-columns: 1fr 1fr; }
.qcard.is-compact .choice { min-height: 44px; font-size: 16px; }

.result { margin: 2px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 15px; }
.result.is-good { background: var(--good-soft); color: var(--good); }
.result.is-bad { background: var(--bad-soft); color: var(--bad); }
.result.is-key { background: var(--accent-soft); color: var(--accent); font-family: var(--f-mono); font-size: 14px; }

/* ---------- student ---------- */
.stage { padding: 28px; }
.take { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.take-head { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
.take-title { display: flex; flex-direction: column; min-width: 0; }
.take-title strong { font: 700 17px/1.2 var(--f-display); }
.take-title span { font-size: 13.5px; color: var(--muted); }
.timer { font: 700 16px/1 var(--f-mono); font-variant-numeric: tabular-nums; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.timer.is-low { color: var(--bad); border-color: var(--bad); }
.dots { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
.qdot {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface);
  font: 700 12.5px/1 var(--f-mono); color: var(--muted); cursor: pointer; padding: 0;
}
.qdot.is-done { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
.qdot.is-right { background: var(--good); border-color: var(--good); color: #fff; }
.qdot.is-wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.qdot[aria-current="step"] { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.q-num { font: 700 13px/1 var(--f-mono); color: var(--accent); margin-bottom: 10px; }
.take-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.take-actions .spacer { flex: 1; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 8px 0 14px; }
.facts > div { background: var(--surface-2); padding: 10px 14px; }
.facts dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.facts dd { margin: 2px 0 0; font: 700 20px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.types-line { font-size: 14px; color: var(--muted); margin: 0 0 16px; }

.done-hero .score-line { display: flex; align-items: flex-end; gap: 18px; margin: 10px 0 18px; flex-wrap: wrap; }
.score-big { font: 800 clamp(52px, 8vw, 76px)/0.9 var(--f-display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.score-big span { font-size: 0.42em; color: var(--muted); letter-spacing: -0.01em; margin-left: 2px; }
.score-meta { display: flex; flex-direction: column; padding-bottom: 6px; }
.score-meta strong { font: 700 24px/1.1 var(--f-display); color: var(--accent); }
.score-meta span { font-size: 14px; color: var(--muted); }
.report-h { font: 700 18px/1.3 var(--f-display); margin: 6px 0 10px; }

/* ---------- stats ---------- */
.bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 28px; margin: 6px 0 18px; }
.bars-group h4 { margin: 0 0 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 9.5em) 1fr auto; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; }
.bar { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar-fill.is-good { background: var(--good); }
.bar-fill.is-bad { background: var(--bad); }
.bar-val { font: 700 13px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bar-val small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.qtable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
.qtable th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); }
.qtable td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.qtable tr:last-child td { border-bottom: 0; }
.qtable .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qtable td.num:first-child { text-align: left; color: var(--muted); font-family: var(--f-mono); }
.qtable .ans { font-family: var(--f-mono); font-size: 13px; color: var(--accent); white-space: nowrap; }
.qtable tr.is-sel td { background: var(--accent-soft); }
.res { font-weight: 700; white-space: nowrap; }
.res.is-good { color: var(--good); }
.res.is-bad { color: var(--bad); }
.res.is-part { color: var(--warn); }
.res.is-blank { color: var(--muted); font-weight: 500; }

/* ---------- grading ---------- */
.grade { display: flex; flex-direction: column; gap: 18px; max-width: 980px; margin: 0 auto; }
.grade-input .fld + .fld { margin-top: 14px; }
.grade-results { display: flex; flex-direction: column; gap: 18px; }
.fine-details { margin-top: 14px; font-size: 13.5px; color: var(--muted); }
.fine-details summary { cursor: pointer; font-weight: 700; color: var(--ink-2); }
.fine-details p { max-width: 70ch; }
.notice.is-bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.notice h3 { margin: 0 0 6px; font: 700 16px var(--f-display); }
.notice ul { margin: 0; padding-left: 18px; }
.report-top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.student { margin-bottom: 4px; }
.meta { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
.score-block { text-align: right; }
.score-pct { font: 700 22px/1.2 var(--f-display); color: var(--accent); margin-top: 6px; }
.vchips { display: flex; gap: 6px; flex-wrap: wrap; }
.vchip { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.vchip.is-good { background: var(--good-soft); color: var(--good); }
.vchip.is-warn { background: var(--warn-soft); color: var(--warn); }
.vchip.is-bad { background: var(--bad-soft); color: var(--bad); }
.report .facts { margin-top: 18px; }

@media (max-width: 960px) {
  .build { grid-template-columns: minmax(0, 1fr); }
  .build-side { position: static; order: -1; }
  .build-side .preview { display: none; }
}
@media (max-width: 640px) {
  .row2, .toggles { grid-template-columns: 1fr; }
  .sec { padding: 18px 16px; }
  .card, .stage { padding: 16px; }
  .choices { grid-template-columns: 1fr 1fr; }
  .mast { padding-block: 12px 10px; }
  .nav { width: 100%; justify-content: space-between; }
  .nav button { padding: 8px 10px; font-size: 14px; flex: 1; }
  .flow { font-size: 13px; }
  .score-block { text-align: left; }
  .bar-row { grid-template-columns: 7.5em 1fr auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .mast, .flow, .nav, .grade-input, .btn, .btn-row, .ex-dialog {
  width: min(560px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: var(--r); padding: 20px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
.ex-dialog::backdrop { background: rgba(14, 18, 27, 0.45); }
.ex-dialog > * + * { margin-top: 14px; }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ex-head h2 { margin: 0; font: 700 20px/1.2 var(--f-display); }
.ex-ask { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.ex-ask .btn-row { margin-top: 10px; }
.ex-status { font-size: 14px; padding: 10px 12px; border-radius: 8px; }
.ex-status:empty { display: none; }
.ex-status.is-good { background: var(--good-soft); color: var(--good); }
.ex-status.is-warn { background: var(--warn-soft); color: var(--warn); }
.ex-status.is-bad { background: var(--bad-soft); color: var(--bad); }
.toast { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; }
}

/* voicing techniques: one row per technique, with its own counter and choices */
.vt-title { margin: 4px 0 -6px; font-size: 14px; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); }
.vt-list { display: flex; flex-direction: column; gap: 10px; }
.vt-row { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.vt-row.is-on { border-color: var(--accent); background: var(--surface); }
.vt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.vt-head strong { font-size: 15px; }
.vt-row .help { margin: 0; }
.vt-opts { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
.sym-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.sym-cell { display: flex; flex-direction: column; gap: 4px; }

/* print tab: settings on the left, a page preview on the right */
.narrow-wide { max-width: 1180px; margin: 0 auto; }
.print-view { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 20px; align-items: start; }
.print-form { display: flex; flex-direction: column; gap: 14px; }
.print-form .display { font-size: clamp(24px, 3vw, 32px); margin: 4px 0 0; }
.print-form .lede { margin: 0; }
.print-status { min-height: 1.2em; }
.print-preview { display: flex; flex-direction: column; gap: 8px; position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); }
.print-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.print-stage { height: min(78vh, 900px); overflow: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.print-holder { margin: 0 auto; }
.print-frame { border: 0; background: #fff; transform-origin: top left; box-shadow: 0 1px 6px rgba(20, 27, 46, .18); display: block; }
.zoom-bar { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.zoom-bar .btn.sm { min-width: 34px; padding: 0 8px; }
.zoom-bar .btn.sm.is-on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.zoom-range { width: 110px; accent-color: var(--accent); }
.zoom-pct { font: 500 12.5px var(--f-mono); color: var(--muted); min-width: 3.4em; text-align: right; }
.print-head { flex-wrap: wrap; }
input.is-invalid { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 960px) { .print-view { grid-template-columns: minmax(0, 1fr); } .print-preview { position: static; } }

/* clearing a quiz: a second click confirms */
.types-top { display: flex; justify-content: flex-end; margin-top: -6px; }
.clear-all.is-armed { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

/* Canvas: the setup dialog, the hand-in steps, and the results page */
.canvas-dialog { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; }
.cv-body { display: flex; flex-direction: column; gap: 14px; }
.cv-steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 14.5px; color: var(--ink-2); }
.cv-item { display: flex; flex-direction: column; gap: 6px; }
.cv-item-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
textarea.cv-code, textarea.cv-result { font: 500 12.5px/1.5 var(--f-mono); resize: vertical; background: var(--surface-2); word-break: break-all; }
textarea.cv-result { margin-top: 10px; }
.canvas-score { margin-top: 4px; font-size: 14px; color: var(--ink-2); }
.canvas-score b { color: var(--accent); font-size: 16px; }
.results-page { padding-top: 4px; }
.results-foot { text-align: center; margin: 4px auto 24px; }

/* Clefwork Keys: the piano, note names, and the builder's combination list */
.piano-box { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 10px; display: flex; justify-content: center; overflow-x: auto; }
.piano-wrap { display: block; max-width: 100%; outline: none; border-radius: 6px; }
.piano-wrap:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
.piano-wrap svg.piano { display: block; width: 100%; max-width: 640px; height: auto; touch-action: manipulation; }
.piano .pk { cursor: pointer; transition: fill 0.08s; }
.piano-wrap.is-readonly .piano .pk { cursor: default; }
.piano .pk-white { fill: #ffffff; stroke: #222; }
.piano .pk-black { fill: #1b1f2b; stroke: #111; }
.piano .pk-white:hover { fill: #eef1fb; }
.piano .pk-black:hover { fill: #333a52; }
.piano-wrap.is-readonly .pk-white:hover { fill: #ffffff; }
.piano-wrap.is-readonly .pk-black:hover { fill: #1b1f2b; }
.piano .pk.is-hl { fill: #f2b441; stroke: #8a5d0c; stroke-width: 1.6; }
.piano .pk.is-sel { fill: #6f7fe6; stroke: #2f3fbf; stroke-width: 1.6; }
.piano .pk.is-right { fill: #3fa877; stroke: #137a4b; stroke-width: 1.6; }
.piano .pk.is-wrong { fill: #e0646b; stroke: #bf3139; stroke-width: 1.6; }
.piano .pk.is-expected { fill: #9fdcbf; stroke: #137a4b; stroke-width: 1.6; stroke-dasharray: 3 2; }
.piano .pk.is-cursor { stroke: #2f3fbf; stroke-width: 2.4; }
.piano .pk-middle { pointer-events: none; fill: #8a93a8; }
.keys-card .keys-prompt, .keys-card .keys-answer { display: flex; flex-direction: column; gap: 8px; }
.keys-name { font: 800 clamp(40px, 7vw, 64px)/1 var(--f-display); text-align: center; padding: 14px 0 6px; letter-spacing: -0.01em; }
input.keys-in { width: 6em; font-size: 20px; }
.keys-count { display: flex; align-items: center; gap: 12px; }
.keys-combo-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.keys-combos { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; color: var(--ink-2); }

/* Clefwork Analysis: boxes on a picture of the score, answered beside the music */
.an-build { display: flex; flex-direction: column; gap: 12px; }
.an-drop { border: 2px dashed var(--line-2); border-radius: var(--r); padding: 28px 18px; text-align: center; background: var(--surface-2); transition: border-color 0.15s, background 0.15s; }
.an-drop.is-over { border-color: var(--accent); background: var(--accent-soft); }
.an-drop-title { margin: 0 0 4px; font: 700 18px/1.3 var(--f-display); }
.an-drop .help { display: block; max-width: 460px; margin: 0 auto; }
.an-status { font-size: 13px; color: var(--muted); }
.an-tools { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
.an-tools .fld { flex: 0 1 auto; }
.an-tools-end { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.an-how { margin: 0; font-size: 14px; color: var(--ink-2); }
.an-stage { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.an-stage > img { display: block; width: 100%; height: auto; pointer-events: none; border-radius: 9px; }
.an-layer { position: absolute; inset: 0; }
.an-reg { position: absolute; padding: 0; margin: 0; border: 2px solid var(--c); border-radius: 4px; background: color-mix(in srgb, var(--c) 16%, transparent); cursor: pointer; font: inherit; }
.an-reg:hover, .an-reg:focus-visible { background: color-mix(in srgb, var(--c) 30%, transparent); }
.an-reg.is-draft { border-style: dashed; background: color-mix(in srgb, var(--c) 12%, transparent); cursor: crosshair; pointer-events: none; }
.an-reg-num { position: absolute; top: -2px; left: -2px; transform: translateY(-100%); background: var(--c); color: #fff; font: 700 11px/1 var(--f-body); padding: 3px 5px; border-radius: 4px 4px 0 0; white-space: nowrap; }
.an-pop { position: absolute; z-index: 3; width: 290px; max-width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; cursor: default; }
.an-pop-q { margin: 0 0 8px; font-weight: 700; font-size: 14.5px; }
.an-pop-row { display: flex; flex-wrap: wrap; gap: 6px; }
.an-pop .btn-link { margin-top: 8px; }
.an-editor-host:not(:empty) { position: sticky; bottom: 8px; z-index: 4; }
.an-editor { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.an-editor .btn-row { margin-top: 0; }
.an-editor .help { margin: 0; }
.an-ed-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.an-ed-head strong { font: 700 16px/1.2 var(--f-display); }
.an-ed-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.an-ed-field { display: flex; flex-direction: column; gap: 4px; }
input.an-ed-in { font: 700 16px var(--f-mono); }
.an-ed-in.is-invalid { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.an-opt { font-weight: 400; color: var(--muted); }
.an-or, .an-sep { font: 400 13px var(--f-body); color: var(--muted); }
.an-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.an-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; background: var(--surface); }
.an-item.is-editing { border-color: var(--accent); border-left-color: var(--c); box-shadow: 0 0 0 2px var(--accent-soft); }
.an-item-num { width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font: 700 13px/26px var(--f-body); text-align: center; }
.an-item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.an-item-ask { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.an-item-ans { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; }
.an-item-ans .fig-rn { font-size: 18px; }
.an-item-act { display: flex; gap: 4px; }
.an-del { color: var(--bad); }
@media (max-width: 640px) { .an-item { grid-template-columns: auto minmax(0, 1fr); } .an-item-act { grid-column: 1 / -1; justify-content: flex-end; } .an-tools-end { margin-left: 0; } }

/* the student's sheet */
.take.is-analysis { max-width: 1180px; }
.an-take { display: flex; flex-direction: column; gap: 12px; }
.an-take-top { display: flex; gap: 12px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.an-lede { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 640px; }
.an-notes { margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.an-zoom { display: flex; align-items: center; gap: 4px; }
.an-zoom-val { min-width: 3.4em; text-align: center; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
.an-key { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 13.5px; }
.an-key-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.an-key-row > b { min-width: 5.5em; }
.an-key-item { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.an-key-fig { font-size: 26px; min-width: 0.9em; display: inline-flex; justify-content: center; color: var(--ink); }
.an-key-fig .fig-stack { margin-left: 0; }
.an-key-none { font: 400 12.5px var(--f-body); color: var(--muted); }
.an-key-how { margin: 0; color: var(--muted); }
.an-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px 4px; }
.an-sheet { min-width: 560px; }
.an-strip { position: relative; overflow: hidden; background: #fff; }
.an-strip:first-child { border-top-left-radius: 8px; border-top-right-radius: 8px; }
.an-strip:last-child { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
.an-strip > img { position: absolute; left: 0; width: 100%; height: auto; pointer-events: none; user-select: none; }
.an-hl { position: absolute; border-radius: 3px; background: color-mix(in srgb, var(--c) 20%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, transparent); cursor: pointer; transition: background 0.12s, box-shadow 0.12s; }
.an-hl.is-hover, .an-hl.is-active { background: color-mix(in srgb, var(--c) 34%, transparent); box-shadow: inset 0 0 0 2.5px var(--c); }
.an-crop .an-hl { cursor: default; }
.an-lane { position: relative; min-height: 50px; background: var(--surface); }
.an-box { position: absolute; top: 8px; left: 0; width: 78px; padding: 4px; border-radius: 8px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--c) 60%, transparent); transition: box-shadow 0.12s; }
.an-box.is-active { box-shadow: 0 0 0 2.5px var(--c); }
.an-num { position: absolute; top: -8px; left: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--c); color: #fff; font: 700 11px/18px var(--f-body); text-align: center; }
.an-field { display: flex; flex-direction: column; align-items: stretch; gap: 1px; }
input.an-in { width: 100%; min-height: 34px; padding: 4px 2px; text-align: center; font: 700 14px var(--f-mono); border-radius: 6px; background: var(--surface); }
.an-in.is-invalid { border-color: var(--bad); color: var(--bad); }
.an-pv { min-height: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--accent); text-align: center; line-height: 1.15; }
.an-pv .fig-rn { font-size: 15px; }
/* On the sheet, how an answer reads pops up under the box being typed in, without moving the others. */
.an-box .an-pv { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); z-index: 5; display: none; padding: 3px 9px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; box-shadow: var(--shadow); }
.an-box:focus-within .an-pv:not(:empty) { display: flex; }
.an-box.is-checked .an-pv { position: static; transform: none; display: flex; padding: 2px 0 0; white-space: normal; background: none; border: 0; box-shadow: none; }
.an-pv .fig-mark { font-size: 12px; justify-content: center; flex-wrap: wrap; }
.an-pv .fig-mark .fig-rn { font-size: 14px; }
.an-field.is-right input.an-in { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.an-field.is-wrong input.an-in { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.an-box .fig-unread { font-size: 11px; }
/* one question on its own (grade checker, results) */
.an-crop { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.an-crop > img { position: absolute; height: auto; pointer-events: none; }
.an-answers { display: flex; flex-wrap: wrap; gap: 14px; }
.an-answer { display: flex; flex-direction: column; gap: 4px; width: 150px; }
.an-answer .an-pv { justify-content: flex-start; font-size: 13px; }

/* retakes */
.retake-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.retake-row .fine { margin: 0; flex: 1; min-width: 14em; }
.attempt-tag { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* ---------- landing page ---------- */
.home { display: flex; flex-direction: column; gap: 22px; padding-bottom: 32px; }
.home-hero { display: flex; align-items: center; gap: 28px; padding-top: 24px; }
.home-logo { flex: none; width: 163px; height: 180px; background: var(--logo-full) center / contain no-repeat; }
.home-intro { min-width: 0; }
.home-hero .display { margin-bottom: 4px; }
.home-hero .lede { margin: 0; }
.home-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tool-card {
  display: flex; flex-direction: column; gap: 8px; padding: 18px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  transition: border-color 0.12s, transform 0.12s;
}
.tool-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.tool-card:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; }
.tool-art { width: 100%; height: auto; color: var(--staff-ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; margin-bottom: 4px; }
.tool-art-hl { fill: #f2b441; }
.tool-art-box { fill: rgba(47, 63, 191, 0.12); stroke: var(--accent); stroke-width: 1.5; }
.tool-art-label { font: 700 11px var(--f-body); fill: var(--accent); }
.tool-name { font: 700 20px/1.2 var(--f-display); letter-spacing: -0.01em; }
.tool-blurb { font-size: 14.5px; color: var(--ink-2); flex: 1; }
.tool-go { font-weight: 700; font-size: 14.5px; color: var(--accent); }
.home-lower { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.home-grade { display: flex; flex-direction: column; gap: 8px; }
.home-grade .card-title, .home-student .card-title { margin: 2px 0 4px; }
.home-grade .fine { margin: 0; }
.home-student { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); transition: border-color 0.12s; }
.home-student:hover { border-color: var(--accent); }
.home-student .fine { margin: 0 0 4px; }
.home-link { margin-right: auto; font-size: 14px; font-weight: 700; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; }
.home-link:hover { color: var(--accent); background: var(--accent-soft); }
@media (max-width: 860px) { .home-tools, .home-lower { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .home-hero { flex-direction: column; align-items: flex-start; gap: 14px; padding-top: 16px; }
  .home-logo { width: 118px; height: 130px; }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tool-art-hl { fill: #e6b65c; } }

/* ---------- start over: held at the top of the window while taking a quiz ---------- */
.take-bar {
  position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 6;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; padding: 8px 8px 8px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.take-bar-about { min-width: 0; font-size: 14px; font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.take-bar .btn { flex: none; }
.confirm-dialog { width: min(440px, calc(100vw - 32px)); }
.confirm-dialog h2 { margin: 0; font: 700 22px/1.2 var(--f-display); }
.confirm-dialog p { margin: 0; color: var(--ink-2); }

<script>
/* Clefwork — music theory model, question generation and grading.
   Pitches are {step: 0-6 (C..B), oct: scientific octave, alt: -1 flat / 0 / 1 sharp}. */
(function (root) {
  'use strict';
  const MQ = (root.MQ = root.MQ || {});

  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const SEMIS = [0, 2, 4, 5, 7, 9, 11];

  const dia = (p) => p.oct * 7 + p.step;
  const midi = (p) => (p.oct + 1) * 12 + SEMIS[p.step] + p.alt;
  const fromDia = (d, alt = 0) => ({ step: ((d % 7) + 7) % 7, oct: Math.floor(d / 7), alt });
  const accSym = (a) => (a === -1 ? '♭' : a === 1 ? '♯' : a === -2 ? '♭♭' : a === 2 ? 'x' : '');
  const pcName = (p) => LETTERS[p.step] + accSym(p.alt);
  const fullName = (p) => pcName(p) + p.oct;
  const samePitch = (a, b) => !!a && !!b && a.step === b.step && a.oct === b.oct && a.alt === b.alt;
  // Starting notes avoid E♯, B♯, F♭, C♭ and anything beyond a single sharp or flat.
  const isCommon = (p) =>
    Math.abs(p.alt) <= 1 &&
    !((p.step === 2 || p.step === 6) && p.alt === 1) &&
    !((p.step === 3 || p.step === 0) && p.alt === -1);
  const okAlt = (p) => Math.abs(p.alt) <= 1;

  // `bottom` is the diatonic index of the bottom staff line (E4 treble, G2 bass).
  const CLEFS = {
    treble: { id: 'treble', label: 'Treble', bottom: 30 },
    bass: { id: 'bass', label: 'Bass', bottom: 18 },
    grand: { id: 'grand', label: 'Grand', bottom: null },
  };
  const clefLabel = (c) => (c === 'grand' ? 'Grand staff' : CLEFS[c].label + ' clef');
  const posOf = (p, clef) => dia(p) - CLEFS[clef].bottom;

  const QUAL = { m: 'minor', M: 'major', P: 'perfect', A: 'augmented', d: 'diminished' };
  const ORD = ['', 'unison', '2nd', '3rd', '4th', '5th', '6th', '7th', 'octave', '9th', '10th', '11th', '12th', '13th'];
  const iv = (id, s) => ({ id, n: +id.slice(1), s, name: QUAL[id[0]] + ' ' + ORD[+id.slice(1)] });
  const INTERVALS = [
    iv('m2', 1), iv('M2', 2), iv('m3', 3), iv('M3', 4), iv('P4', 5), iv('A4', 6), iv('d5', 6),
    iv('P5', 7), iv('m6', 8), iv('M6', 9), iv('m7', 10), iv('M7', 11), iv('P8', 12),
    // Compound intervals (added after the others so older quiz codes keep their meaning).
    iv('m9', 13), iv('M9', 14), iv('m10', 15), iv('M10', 16), iv('P11', 17), iv('A11', 18),
    iv('P12', 19), iv('m13', 20), iv('M13', 21),
  ];
  const SIMPLE_INTERVALS = 13;

  // Chord and scale members are [interval number, semitones] above the root.
  const CHORDS = [
    { id: 'maj', label: 'Major', name: 'major triad', iv: [[3, 4], [5, 7]] },
    { id: 'min', label: 'Minor', name: 'minor triad', iv: [[3, 3], [5, 7]] },
    { id: 'dim', label: 'Diminished', name: 'diminished triad', iv: [[3, 3], [5, 6]] },
    { id: 'aug', label: 'Augmented', name: 'augmented triad', iv: [[3, 4], [5, 8]] },
    { id: 'dom7', label: 'Dominant 7', name: 'dominant 7th chord', iv: [[3, 4], [5, 7], [7, 10]] },
    { id: 'maj7', label: 'Major 7', name: 'major 7th chord', iv: [[3, 4], [5, 7], [7, 11]] },
    { id: 'min7', label: 'Minor 7', name: 'minor 7th chord', iv: [[3, 3], [5, 7], [7, 10]] },
    { id: 'hdim7', label: 'Half-dim 7', name: 'half-diminished 7th chord', iv: [[3, 3], [5, 6], [7, 10]] },
  ];
  const INVERSIONS = [
    { id: 'root', label: 'Root position', name: 'root position' },
    { id: 'inv1', label: '1st inversion', name: 'first inversion' },
    { id: 'inv2', label: '2nd inversion', name: 'second inversion' },
    { id: 'inv3', label: '3rd inversion', name: 'third inversion', title: '7th chords only' },
  ];
  const SCALES = [
    { id: 'major', label: 'Major', name: 'major scale', iv: [[2, 2], [3, 4], [4, 5], [5, 7], [6, 9], [7, 11], [8, 12]] },
    { id: 'natmin', label: 'Natural minor', name: 'natural minor scale', iv: [[2, 2], [3, 3], [4, 5], [5, 7], [6, 8], [7, 10], [8, 12]] },
    { id: 'harmin', label: 'Harmonic minor', name: 'harmonic minor scale', iv: [[2, 2], [3, 3], [4, 5], [5, 7], [6, 8], [7, 11], [8, 12]] },
    { id: 'melmin', label: 'Melodic minor', name: 'melodic minor scale', iv: [[2, 2], [3, 3], [4, 5], [5, 7], [6, 9], [7, 11], [8, 12]] },
    // Added after the first four so older quiz codes keep their meaning.
    { id: 'majpent', label: 'Major pentatonic', name: 'major pentatonic scale', pent: true, iv: [[2, 2], [3, 4], [5, 7], [6, 9], [8, 12]] },
    { id: 'minpent', label: 'Minor pentatonic', name: 'minor pentatonic scale', pent: true, iv: [[3, 3], [4, 5], [5, 7], [7, 10], [8, 12]] },
    { id: 'ionian', label: 'Ionian', name: 'Ionian mode', mode: true, iv: [[2, 2], [3, 4], [4, 5], [5, 7], [6, 9], [7, 11], [8, 12]] },
    { id: 'dorian', label: 'Dorian', name: 'Dorian mode', mode: true, iv: [[2, 2], [3, 3], [4, 5], [5, 7], [6, 9], [7, 10], [8, 12]] },
    { id: 'phrygian', label: 'Phrygian', name: 'Phrygian mode', mode: true, iv: [[2, 1], [3, 3], [4, 5], [5, 7], [6, 8], [7, 10], [8, 12]] },
    { id: 'lydian', label: 'Lydian', name: 'Lydian mode', mode: true, iv: [[2, 2], [3, 4], [4, 6], [5, 7], [6, 9], [7, 11], [8, 12]] },
    { id: 'mixolydian', label: 'Mixolydian', name: 'Mixolydian mode', mode: true, iv: [[2, 2], [3, 4], [4, 5], [5, 7], [6, 9], [7, 10], [8, 12]] },
    { id: 'aeolian', label: 'Aeolian', name: 'Aeolian mode', mode: true, iv: [[2, 2], [3, 3], [4, 5], [5, 7], [6, 8], [7, 10], [8, 12]] },
    { id: 'locrian', label: 'Locrian', name: 'Locrian mode', mode: true, iv: [[2, 1], [3, 3], [4, 5], [5, 6], [6, 8], [7, 10], [8, 12]] },
  ];
  const SIMPLE_SCALES = 4;

  // Indexed by fifths + 7 (−7 = seven flats … +7 = seven sharps).
  const MAJOR_KEYS = ['C♭', 'G♭', 'D♭', 'A♭', 'E♭', 'B♭', 'F', 'C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'C♯'];
  const MINOR_KEYS = ['A♭', 'E♭', 'B♭', 'F', 'C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'C♯', 'G♯', 'D♯', 'A♯'];
  const keyName = (fifths, mode) => (mode === 'minor' ? MINOR_KEYS : MAJOR_KEYS)[fifths + 7] + ' ' + mode;

  const TYPES = [

      for (let i = 0; i < len; i++) bytes.push(this.u(8));
      return new TextDecoder().decode(new Uint8Array(bytes));
    }
  }

  const group = (s) => s.match(/.{1,5}/g).join('-');
  function normalize(code) {
    return String(code || '').toUpperCase().replace(/[O]/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');
  }

  function pack(kind, rest, sealKey) {
    rest = rest.slice();
    const head = 16 + 4 + (sealKey != null ? 16 : 0);
    while ((head + rest.length) % 5) rest.push(0);
    let body = toBits(kind, 4);
    if (sealKey != null) body = body.concat(toBits(seal16(bitsToBytes(rest), sealKey), 16));
    body = body.concat(rest);
    const all = toBits(crc16(bitsToBytes(body)), 16).concat(body);
    let s = '';
    for (let i = 0; i < all.length; i += 5) {
      let v = 0;
      for (let j = 0; j < 5; j++) v = v * 2 + all[i + j];
      s += B32[v];
    }
    return group(s);
  }

  class CodeError extends Error {}
  function unpack(code) {
    const clean = normalize(code);
    if (clean.length < 8) throw new CodeError('That code is too short. Check that you copied all of it.');
    const bits = [];
    for (const ch of clean) {
      const v = B32.indexOf(ch);
      if (v < 0) throw new CodeError(`“${ch}” isn’t used in these codes. Check for a typo.`);
      bits.push(...toBits(v, 5));
    }
    const crc = new Reader(bits).u(16);
    const body = bits.slice(16);
    if (crc16(bitsToBytes(body)) !== crc) throw new CodeError('This code has a typo or is incomplete — the checksum doesn’t match.');
    return { kind: new Reader(body).u(4), body, clean };
  }

  const quizId = (code) => crc16(utf8(normalize(code)));

  // ---------- quiz codes ----------
  // Retakes a quiz allows after the first attempt: a number from 0 to 31, or null for no limit.
  const retakeLimit = (cfg) => (cfg && Number.isInteger(cfg.retakes) && cfg.retakes >= 0 ? Math.min(31, cfg.retakes) : null);
  function encodeQuiz(cfg) {
    const w = new Writer();
    // Version 2 added teacher-defined chords after the flags; version 3 adds how many to ask
    // plus grand-staff voicings. Older codes still decode.
    w.u(15, 4).u(cfg.seed, 20).str(cfg.title, 60).str(cfg.teacher, 40).u(cfg.clefs, 2);
    COUNT_KEYS.forEach((k) => w.u(Math.min(31, cfg.counts[k] || 0), 5));
    w.u(cfg.ledger, 2).u(cfg.accMode, 2).u(cfg.intervals, 13).u(cfg.intervalDir, 2).u(cfg.chords, 8)
      .u(cfg.scales, 4).u(cfg.scaleLen, 1).u(cfg.keyMode, 2).u(cfg.keyMax, 3).u(Math.min(127, cfg.timeLimit), 7);
    MQ.FLAG_KEYS_V1.forEach((k) => w.u(cfg.flags[k] ? 1 : 0, 1));
    const custom = (cfg.custom || []).slice(0, MQ.MAX_CUSTOM);
    w.u(cfg.customGrade ? 1 : 0, 1).u(custom.length, 5);
    custom.forEach((c) => {
      w.str4(c.symbol, 15).u(c.clef === 'bass' ? 1 : 0, 1);
      const notes = c.notes.slice(0, MQ.MAX_CUSTOM_NOTES);
      w.u(notes.length, 3);
      notes.forEach((p) => w.u(MQ.dia(p), 7).u(p.alt + 1, 2));
    });
    w.u(Math.min(custom.length, cfg.counts.custom == null ? custom.length : cfg.counts.custom), 5);
    const voicings = (cfg.voicings || []).slice(0, MQ.MAX_CUSTOM);
    w.u(voicings.length, 5);
    voicings.forEach((v) => {
      const notes = v.notes.slice(0, MQ.MAX_VOICING_NOTES);
      w.str4(v.symbol, 15).u(['grand', 'treble', 'bass'].indexOf(v.staff || 'grand'), 2).u(notes.length, 4);
      notes.forEach((p) => w.u(MQ.dia(p), 7).u(p.alt + 1, 2).u(p.st === 1 ? 1 : 0, 1));
    });
    w.u(Math.min(voicings.length, cfg.counts.voicing || 0), 5);
    w.u(cfg.inversions || 1, 4); // version 4: which chord inversions to ask
    // Version 6: chord progressions.
    const progs = (cfg.progs || []).slice(0, MQ.MAX_CUSTOM);
    w.u(cfg.progMode || 0, 3).u(progs.length, 5);
    progs.forEach((e) => {
      const k = e.key;
      w.u(e.kind === 'auto' ? 1 : 0, 1).u(STAVES.indexOf(e.staff), 2).u(KEY_MODES.indexOf(k.mode), 2)
        .u(k.tonic.step, 3).u(k.tonic.alt + 1, 2).u(k.fifths + 7, 4).u(k.minorType === 'melodic' ? 1 : 0, 1).u(e.voicing === 'open' ? 1 : 0, 1);
      if (e.kind === 'auto') w.u(e.len - 3, 3).u(e.sevenths, 2).u(e.deceptive ? 1 : 0, 1).u((e.qcount || 1) - 1, 4);
      else {
        const chords = e.chords.slice(0, 8);
        w.u(chords.length, 4);
        chords.forEach((c) => w.u(c.root.step, 3).u(c.root.alt + 2, 3).u(MQ.QUALITY_IDS.indexOf(c.q), 5));
      }
    });
    w.u(Math.min(30, cfg.counts.progression || 0), 5);
    // Version 7: chord qualities, sizes, altered extensions and staves for "Build a chord".
    w.u(cfg.chordQual == null ? 3 : cfg.chordQual, 5).u(cfg.chordSize == null ? 5 : cfg.chordSize, 6)
      .u(cfg.chordAlt || 0, 2).u(cfg.chordStaff == null ? 3 : cfg.chordStaff, 3);
    // Version 8: figured bass settings and how many of each figured-bass question to ask.
    w.u(cfg.figKey == null ? 1 : cfg.figKey, 2).u(cfg.figMax == null ? 3 : cfg.figMax, 3).u(cfg.figAlt || 0, 2)
      .u(cfg.figSize == null ? 1 : cfg.figSize, 2).u(cfg.figPos == null ? 7 : cfg.figPos, 4)
      .u(cfg.figClefs == null ? 3 : cfg.figClefs, 2).u(cfg.figAsk == null ? 1 : cfg.figAsk, 2).u((cfg.figLen || 4) - 3, 3)
      .u(Math.min(31, cfg.counts.figured || 0), 5).u(Math.min(31, cfg.counts.figprog || 0), 5);
    // Version 9: compound intervals and the extra scales sit above the older 13- and 4-bit fields,
    // plus the new question directions, the figured bass progression's own settings and new flags.
    w.u(Math.floor((cfg.intervals || 0) / 8192), 11).u(Math.floor((cfg.scales || 0) / 16), 9)
      .u(cfg.scaleModes ? 1 : 0, 1).u(cfg.scaleAsk == null ? 1 : cfg.scaleAsk, 2).u(cfg.keyAsk == null ? 1 : cfg.keyAsk, 2)
      .u(cfg.figpKey == null ? 1 : cfg.figpKey, 2).u(cfg.figpMax == null ? 3 : cfg.figpMax, 3).u(cfg.figpAlt || 0, 2)
      .u(cfg.figpSize == null ? 1 : cfg.figpSize, 2).u(cfg.figpPos == null ? 7 : cfg.figpPos, 4).u(cfg.figpClefs == null ? 3 : cfg.figpClefs, 2);
    MQ.FLAG_KEYS.slice(MQ.FLAG_KEYS_V1.length).forEach((k) => w.u(cfg.flags[k] ? 1 : 0, 1));
    // Version 10: the grand staff as a quiz-wide option, each tab's staff and notes overrides,
    // and the figured bass progression's direction.
    w.u((cfg.clefs & 4) ? 1 : 0, 1);
    STAFF_TABS.forEach((k) => w.u((cfg.staffOv && cfg.staffOv[k]) || 0, 2));
    HELP_TABS.forEach((k) => w.u((cfg.helpOv && cfg.helpOv[k]) == null ? 0 : cfg.helpOv[k], 2));
    w.u(cfg.figpAsk == null ? 1 : cfg.figpAsk, 2);
    w.u(cfg.chordAsk == null ? 1 : cfg.chordAsk, 2); // version 11: the Chords tab's direction
    // Slash chords in written progressions: their bass note (added in version 9).
    progs.forEach((e) => {
      if (e.kind === 'auto') return;
      e.chords.slice(0, 8).forEach((c) => {
        w.u(c.bass ? 1 : 0, 1);
        if (c.bass) w.u(c.bass.step, 3).u(c.bass.alt + 2, 3);
      });
    });
    // Version 12: the single-chord and progression voicing categories.
    w.u((cfg.helpOv && cfg.helpOv.vprog) == null ? 2 : cfg.helpOv.vprog, 2);
    [cfg.vc, cfg.vp].forEach((b, i) => {
      const s2 = MQ.voiceSettings(b);
      w.u(s2.sizes, 3).u(s2.quals, 5).u(s2.alts ? 1 : 0, 1).u(s2.key, 2).u(s2.slash ? 1 : 0, 1).u(s2.ask, 2);
      if (i === 1) w.u(Math.max(2, Math.min(9, s2.len)) - 2, 3);
      MQ.TECHNIQUES.forEach((t) => w.u(Math.min(31, (s2.tech && s2.tech[t.id]) || 0), 5));
      const o = s2.opts || {};
      w.u(o.thirdsStaff || 0, 2).u(o.thirdsOmitRoot ? 1 : 0, 1).u(o.blockStaff || 0, 2)
        .u(o.planesOpen || 0, 2).u(o.popNotes === 4 ? 1 : 0, 1).u(o.popStaff || 0, 2).u(o.inner2 ? 1 : 0, 1);
    });
    // Version 14: how many points the quiz is worth in Canvas, so results pages can scale the score.
    w.u(Math.max(0, Math.min(1000, Math.round(cfg.canvasPts || 0))), 10);
    // Version 15: Keys & Notes — how many, which ways of showing and answering, and the range.
    const k = MQ.keysSettings(cfg.keys);
    w.u(Math.min(63, (cfg.counts && cfg.counts.keys) || 0), 6).u(k.prompts, 3).u(k.answers, 3).u(k.low, 7).u(k.high, 7);
    // The 4-bit version number stops at 15, so later additions follow an 8-bit extension number.
    // Codes from before have only padding here. Extension 1: Clefwork Analysis — the boxes on the
    // score and their answers, and a fingerprint of the picture (which travels in the link).
    // Quizzes without it keep exactly the codes they had.
    // Extension 2: a limit on retakes (0–31). Unlimited retakes — the default — write nothing,
    // so those quizzes keep their codes too; a limit also writes the (possibly empty) block before it.
    const an = MQ.analysisSettings(cfg.analysis);
    const regions = an.regions.slice(0, MQ.ANALYSIS_MAX);
    const limit = retakeLimit(cfg);
    if (regions.length || an.img || limit != null) {
      const q10 = (v) => Math.max(0, Math.min(1023, Math.round(v * 1023)));
      w.u(limit != null ? 2 : 1, 8).u(an.override, 2).u(an.img ? 1 : 0, 1);
      if (an.img) w.u(an.img.hash >>> 0, 32);
      w.strN(an.notes, 200, 8).u(regions.length, 6);
      regions.forEach((r) => {
        w.u(q10(r.x), 10).u(q10(r.y), 10).u(q10(r.w), 10).u(q10(r.h), 10)
          .u(Math.max(1, MQ.ANALYSIS_ASKS.indexOf(r.ask)), 2).str(r.roman, 63).str(r.symbol, 63);
      });
      if (limit != null) w.u(limit, 5);
    }
    return pack(KIND_QUIZ, w.b);
  }

  function decodeQuiz(code) {
    const { kind, body } = unpack(code);
    if (kind === KIND_REPORT) throw new CodeError('This is a student report code. Paste it on the Grade reports tab.');
    if (kind !== KIND_QUIZ) throw new CodeError('This isn’t a Clefwork quiz code.');
    const r = new Reader(body);
    r.u(4);
    try {
      const v = r.u(4);
      if (v < 1 || v > 15) throw new CodeError('This quiz was made with a newer version of Clefwork.');
      const cfg = { seed: r.u(20), title: r.str(), teacher: r.str(), clefs: r.u(2), counts: {} };
      COUNT_KEYS.forEach((k) => (cfg.counts[k] = r.u(5)));
      Object.assign(cfg, {
        ledger: r.u(2), accMode: r.u(2), intervals: r.u(13), intervalDir: r.u(2), chords: r.u(8),
        scales: r.u(4), scaleLen: r.u(1), keyMode: r.u(2), keyMax: r.u(3), timeLimit: r.u(7), flags: {},
      });
      MQ.FLAG_KEYS_V1.forEach((k) => (cfg.flags[k] = !!r.u(1)));
      MQ.FLAG_KEYS.slice(MQ.FLAG_KEYS_V1.length).forEach((k) => (cfg.flags[k] = false));
      cfg.custom = [];
      cfg.customGrade = 0;
      if (v >= 2) {
        cfg.customGrade = r.u(1);
        const n = r.u(5);
        for (let i = 0; i < n; i++) {
          const c = { symbol: r.str4(), clef: r.u(1) ? 'bass' : 'treble', notes: [] };
          const k = r.u(3);
          for (let j = 0; j < k; j++) { const d = r.u(7); c.notes.push(MQ.fromDia(d, r.u(2) - 1)); }
          cfg.custom.push(c);
        }
      }
      cfg.counts.custom = cfg.custom.length;
      cfg.counts.voicing = 0;
      cfg.voicings = [];
      if (v >= 3) {
        cfg.counts.custom = r.u(5);
        const n = r.u(5);
        for (let i = 0; i < n; i++) {
          const vo = { symbol: r.str4(), staff: v >= 5 ? ['grand', 'treble', 'bass'][r.u(2)] || 'grand' : 'grand', notes: [] };
          const k = r.u(4);
          for (let j = 0; j < k; j++) {
            const d = r.u(7);
            const p = MQ.fromDia(d, r.u(2) - 1);
            const st = r.u(1);
            if (vo.staff === 'grand') p.st = st;
            vo.notes.push(p);
          }
          cfg.voicings.push(vo);
        }
        cfg.counts.voicing = r.u(5);
      }
      cfg.inversions = v >= 4 ? r.u(4) || 1 : 1;
      cfg.progMode = 0;
      cfg.progs = [];
      cfg.counts.progression = 0;
      if (v >= 6) {
        cfg.progMode = r.u(3);
        const n = r.u(5);
        for (let i = 0; i < n; i++) {
          const kind = r.u(1) ? 'auto' : 'written';
          const staff = STAVES[r.u(2)] || 'treble';
          const mode = KEY_MODES[r.u(2)] || 'major';
          const tonic = { step: r.u(3), alt: r.u(2) - 1 };
          const fifths = r.u(4) - 7;
          const minorType = r.u(1) ? 'melodic' : 'harmonic';
          const e = { kind, staff, key: MQ.makeKey(mode, fifths, tonic, minorType), voicing: r.u(1) ? 'open' : 'closed' };
          if (kind === 'auto') Object.assign(e, { len: r.u(3) + 3, sevenths: r.u(2), deceptive: !!r.u(1), qcount: r.u(4) + 1 });
          else {
            e.chords = [];
            const k = r.u(4);
            for (let j = 0; j < k; j++) e.chords.push({ root: { step: r.u(3), alt: r.u(3) - 2 }, q: MQ.QUALITY_IDS[r.u(5)] || 'maj' });
          }
          cfg.progs.push(e);
        }
        cfg.counts.progression = r.u(5);
      }
      Object.assign(cfg, { chordQual: 3, chordSize: 5, chordAlt: 0, chordStaff: 3 });
      if (v >= 7) Object.assign(cfg, { chordQual: r.u(5), chordSize: r.u(6), chordAlt: r.u(2), chordStaff: r.u(3) });
      Object.assign(cfg, { figKey: 1, figMax: 3, figAlt: 0, figSize: 1, figPos: 7, figClefs: 3, figAsk: 1, figLen: 4 });
      cfg.counts.figured = 0;
      cfg.counts.figprog = 0;
      if (v >= 8) {
        Object.assign(cfg, { figKey: r.u(2), figMax: r.u(3), figAlt: r.u(2), figSize: r.u(2), figPos: r.u(4), figClefs: r.u(2), figAsk: r.u(2), figLen: r.u(3) + 3 });
        cfg.counts.figured = r.u(5);
        cfg.counts.figprog = r.u(5);
      }
      cfg.staffOv = { place: 0, identify: 0, interval: 0, scale: 0, keysig: 0, chord: 0, figured: 0, figprog: 0 };
      cfg.helpOv = { interval: 0, chord: 0, custom: 2, voicing: 2, vprog: 2 };
      cfg.figpAsk = 1;
      cfg.chordAsk = 1;
      Object.assign(cfg, { scaleModes: 0, scaleAsk: 1, keyAsk: 1, figpKey: cfg.figKey, figpMax: cfg.figMax, figpAlt: cfg.figAlt, figpSize: cfg.figSize, figpPos: cfg.figPos, figpClefs: cfg.figClefs });
      if (v >= 9) {
        cfg.intervals += r.u(11) * 8192;
        cfg.scales += r.u(9) * 16;
        cfg.scaleModes = r.u(1);
        cfg.scaleAsk = r.u(2);
        cfg.keyAsk = r.u(2);
        Object.assign(cfg, { figpKey: r.u(2), figpMax: r.u(3), figpAlt: r.u(2), figpSize: r.u(2), figpPos: r.u(4), figpClefs: r.u(2) });
        MQ.FLAG_KEYS.slice(MQ.FLAG_KEYS_V1.length).forEach((k) => (cfg.flags[k] = !!r.u(1)));
        if (v >= 10) {
          if (r.u(1)) cfg.clefs |= 4;
          cfg.staffOv = {};
          STAFF_TABS.forEach((k) => (cfg.staffOv[k] = r.u(2)));
          cfg.helpOv = {};
          HELP_TABS.forEach((k) => (cfg.helpOv[k] = r.u(2)));
          cfg.figpAsk = r.u(2);
          if (v >= 11) cfg.chordAsk = r.u(2);
        }
        cfg.progs.forEach((e) => {
          if (e.kind === 'auto') return;
          e.chords.forEach((c) => { if (r.u(1)) c.bass = { step: r.u(3), alt: r.u(3) - 2 }; });
        });
      }
      cfg.vc = MQ.defaultConfig().vc;
      cfg.vp = MQ.defaultConfig().vp;
      cfg.canvasPts = 0;
      cfg.retakes = null;
      cfg.keys = MQ.defaultConfig().keys;
      cfg.counts.keys = 0;
      cfg.analysis = MQ.defaultConfig().analysis;
      cfg.counts.analysis = 0;
      if (cfg.helpOv.vprog == null) cfg.helpOv.vprog = 2;
      if (v >= 12) {
        cfg.helpOv.vprog = r.u(2);
        [cfg.vc, cfg.vp].forEach((b, i) => {
          b.sizes = r.u(3); b.quals = r.u(5); b.alts = r.u(1); b.key = r.u(2); b.slash = r.u(1); b.ask = r.u(2);
          if (i === 1) b.len = r.u(3) + 2;
          b.tech = {};
          MQ.TECHNIQUES.forEach((t) => { const n = r.u(5); if (n) b.tech[t.id] = n; });
          b.opts = { thirdsStaff: r.u(2), thirdsOmitRoot: r.u(1), blockStaff: r.u(2), planesOpen: r.u(2), popNotes: r.u(1) ? 4 : 3, popStaff: r.u(2), inner2: r.u(1) };
        });
        if (v >= 14) cfg.canvasPts = r.u(10);
        if (v >= 15) {
          cfg.counts.keys = r.u(6);
          cfg.keys = { prompts: r.u(3), answers: r.u(3), low: r.u(7), high: r.u(7) };
          const ext = r.b.length - r.p >= 8 ? r.u(8) : 0;
          if (ext >= 1) {
            const an = { override: r.u(2), img: null, notes: '', regions: [] };
            if (r.u(1)) an.img = { hash: r.u(32) };
            an.notes = r.strN(8);
            const n = r.u(6);
            for (let i = 0; i < n; i++) {
              const box = { x: r.u(10) / 1023, y: r.u(10) / 1023, w: r.u(10) / 1023, h: r.u(10) / 1023 };
              an.regions.push(Object.assign(box, { ask: MQ.ANALYSIS_ASKS[r.u(2)] || 'roman', roman: r.str(), symbol: r.str() }));
            }
            cfg.analysis = an;
            cfg.counts.analysis = n;
          }
          if (ext >= 2) cfg.retakes = r.u(5);
        }
        const sum = (b) => MQ.TECHNIQUES.reduce((n, t) => n + ((b.tech && b.tech[t.id]) || 0), 0);
        cfg.counts.voicing = sum(cfg.vc);
        cfg.counts.vprog = sum(cfg.vp);
      }
      cfg.v = v; // older quizzes keep their original questions
      return cfg;
    } catch (e) {
      if (e instanceof CodeError) throw e;
      throw new CodeError('This quiz code is incomplete.');
    }
  }

  // ---------- report codes ----------
  const sealKey = (cfg, qid) => `clefwork:${cfg.seed}:${qid}`;

  // report: {name, submittedAt (ms), totalSec, partial, items:[{type, clef, credit 0-7, answered, sec}]}
  // ---------- student answers inside report codes (version 4) ----------
  // Each question's entry is written in a self-describing way so a report can be read without the quiz:
  //   choice questions: 0 = blank, else choice + 1 (3 bits)
  //   staff questions: for each answer column, how many notes, then each note (letter-step 7, accidental 3, staff 1)
  //   progressions: for each chord, the Roman numeral and chord-symbol boxes as short text (up to 15 characters)
  const isChoiceType = (t) => t === 'identify' || t === 'keysig';
  // Music signs students may type get their own small codes; other non-ASCII characters become "?".
  const SIGNS = ['', '°', 'ø', '♭', '♯', 'Δ', '♮', 'º', 'Ø'];
  function writeText(w, str) {
    const chars = Array.from(String(str || '').trim()).slice(0, 15)
      .map((c) => (SIGNS.indexOf(c) > 0 ? SIGNS.indexOf(c) : c.charCodeAt(0) < 128 && c.charCodeAt(0) >= 32 ? c.charCodeAt(0) : 63));
    w.u(chars.length, 4);
    chars.forEach((c) => w.u(c, 7));
  }
  function readText(r) {
    const n = r.u(4);
    let s = '';
    for (let i = 0; i < n; i++) { const c = r.u(7); s += c < SIGNS.length && c > 0 ? SIGNS[c] : String.fromCharCode(c); }
    return s;
  }
  const KEY_ANSWERS = ['staff', 'name', 'piano'];
  function writeAnswer(w, q, resp) {
    if (q.type === 'analysis') { writeText(w, resp && resp.r); writeText(w, resp && resp.s); return; }
    if (q.type === 'keys') {
      const kind = KEY_ANSWERS.indexOf(q.keys.answer);
      w.u(kind, 2);
      if (q.keys.answer === 'name') { writeText(w, resp); return; }
      if (q.keys.answer === 'piano') { w.u(typeof resp === 'number' ? 1 : 0, 1); if (typeof resp === 'number') w.u(resp, 7); return; }
    }
    if (q.type === 'voicing' || q.type === 'vprog') {
      // A voicing answer is either notes on the staff or one typed chord symbol per chord.
      const list = q.symbolAnswers || (q.symbolAnswer ? [q.symbolAnswer] : null);
      w.u(list ? 1 : 0, 1);
      if (list) {
        const n = Math.min(15, list.length);
        w.u(n, 4);
        for (let j = 0; j < n; j++) writeText(w, q.symbolAnswers ? (resp && resp[j]) : resp);
        return;
      }
    }
    if (q.type === 'chord') {
      w.u(q.symbolAnswer ? 1 : 0, 1);
      if (q.symbolAnswer) { writeText(w, resp); return; }
    }
    if (q.type === 'figprog') {
      const n = Math.min(15, q.figuredList.length);
      w.u(n, 4);
      for (let j = 0; j < n; j++) { const a = (resp && resp[j]) || {}; writeText(w, a.text); writeText(w, a.fig); }
    } else if (q.type === 'figured') {
      // 0 = typed numeral and figure, 1 = notes written on the staff
      const spell = q.figured.ask === 'spell';
      w.u(spell ? 1 : 0, 1);

  }
  let figUid = 0;
